services:
  postgres:
    image: postgres:16-alpine
    container_name: quantifiedge-postgres
    environment:
      POSTGRES_DB: quantedge
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-quantifiedge}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-quantifiedge_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantifiedge -d quantedge"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: quantifiedge-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/quantedge}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-quantifiedge}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-quantifiedge_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-min-256-bits}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3100,http://localhost:3101}
      DELTA_API_URL: ${DELTA_API_URL:-https://api.india.delta.exchange}
      PYTHON_ENGINE_URL: http://engine:8000
      PYTHON_ENGINE_API_KEY: ${PYTHON_ENGINE_API_KEY:?PYTHON_ENGINE_API_KEY must be set}
      DEVELOPER_EMAIL: ${DEVELOPER_EMAIL:-}
      DEVELOPER_INITIAL_PASSWORD: ${DEVELOPER_INITIAL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@quantedge.ai}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_DEV_LOG_ENABLED: ${MAIL_DEV_LOG_ENABLED:-false}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    container_name: quantifiedge-engine
    # Phase 1: a permanently dead public market-data feed makes the engine exit
    # non-zero (see quantedge/__main__.py). Without a restart policy that exit
    # is a permanent stop, so the fatal-exit contract needs this to be useful.
    # `unless-stopped` keeps a deliberate `docker compose stop` deliberate.
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql://${SPRING_DATASOURCE_USERNAME:-quantifiedge}:${SPRING_DATASOURCE_PASSWORD:-quantifiedge_dev}@postgres:5432/quantedge
      # Phase 1 process-level gate for the PUBLIC market-data feed. Default
      # false = the engine stays completely inert. Setting it true binds the
      # closed-candle structure clock only; it arms no execution path and reads
      # no credential. Per-account algo_enabled / kill_switch_active are
      # unaffected and remain the only authority over trading.
      LIVE_FEED_ENABLED: ${LIVE_FEED_ENABLED:-false}
      # Phase 2 durable structure state. LuxAlgo internal structure is
      # path-dependent from bar 0 and ATR(200) is an infinite-memory recursion,
      # so a restart that cannot resume its EXACT snapshot has to invent a
      # warmup instead. The path below is the mount point of the dedicated
      # `engine_state` volume declared at the bottom of this file, so the
      # snapshot survives `docker compose up --force-recreate` and image
      # rebuilds. It is NOT inside /app: the code tree stays read-only-ish and
      # only this one directory is writable and persistent. No credential is
      # ever written here - the snapshot holds structure/OB state only.
      ENGINE_STATE_DIR: ${ENGINE_STATE_DIR:-/var/lib/quantedge/state}
      # First-boot genesis origin, deliberately EMPTY by default.
      #
      # With no snapshot and no genesis origin the engine stays up, refuses to
      # subscribe, and reports DOWN on /health with the reason. That is the
      # fail-closed choice: the alternative would be cold-starting a
      # path-dependent detector from the first live candle and calling it
      # continuous. Arming genesis is therefore an explicit operator act -
      # point this at the canonical history mounted read-only below, e.g.
      # ENGINE_GENESIS_HISTORY_DIR=/app/data/canonical/delta_exchange_india
      # Only `<SYMBOL>/1h/full_history.csv` is accepted as an origin; the
      # `2026.csv` fallback is refused, because a 2026-01-01 start is a
      # truncated history wearing a complete one's clothes.
      ENGINE_GENESIS_HISTORY_DIR: ${ENGINE_GENESIS_HISTORY_DIR:-}
      # Python engine receives market data and executes per-user live orders
      DELTA_BASE_URL: https://api.india.delta.exchange
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_API_KEY: ${PYTHON_ENGINE_API_KEY:?PYTHON_ENGINE_API_KEY must be set}
    volumes:
      # The ONLY writable persistent location. Named volume, not a bind mount,
      # so it is owned by uid/gid 1000 (`appuser:appgroup`) seeded from the
      # image directory created in docker/Dockerfile.engine.
      - engine_state:/var/lib/quantedge/state
      # Read-only genesis input. Mounted but unused until
      # ENGINE_GENESIS_HISTORY_DIR is set; `:ro` keeps the checked-in canonical
      # history immutable from inside the container.
      - ./data/canonical:/app/data/canonical:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.user-app
    container_name: quantifiedge-user-app
    ports:
      - "3100:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  developer-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.developer-app
    container_name: quantifiedge-developer-app
    ports:
      - "3101:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  # Phase 2: durable Manual SMC structure snapshot. Declared as a named volume
  # so `docker compose down` (without -v) and any container recreation keep it.
  engine_state:

networks:
  default:
    name: quantifiedge-network
