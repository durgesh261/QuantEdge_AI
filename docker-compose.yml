services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: quantedge-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/quantedge.db
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET}
      DELTA_API_KEY: ${DELTA_API_KEY}
      DELTA_API_SECRET: ${DELTA_API_SECRET}
      DELTA_ENVIRONMENT: ${DELTA_ENVIRONMENT}
      AUTH_TOKEN: ${AUTH_TOKEN}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET}
      SESSION_JWT_EXPIRES_IN: ${SESSION_JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_LIVE_TRADING: ${ALLOW_LIVE_TRADING}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/system/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: quantedge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN}
      - VITE_API_URL=/api/v1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    driver: local