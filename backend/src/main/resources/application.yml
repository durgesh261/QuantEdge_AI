spring:
  application:
    name: quantifiedge-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantedge}
    username: ${SPRING_DATASOURCE_USERNAME:quantifiedge}
    password: ${SPRING_DATASOURCE_PASSWORD:quantifiedge_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial schema

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 30m
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.quantedge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

quantedge:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits}
    expiration: 86400000 # 24 hours
    refresh-expiration: 604800000 # 7 days
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  delta:
    api-base-url: ${DELTA_API_URL:https://api.india.delta.exchange}
  news:
    provider-mode: ${NEWS_PROVIDER_MODE:external}
    api-base-url: ${NEWS_PROVIDER_BASE_URL:https://min-api.cryptocompare.com/data/v2/news/?lang=EN}
    api-key: ${NEWS_PROVIDER_API_KEY:}
    ingest-rate-ms: ${NEWS_INGEST_RATE_MS:1800000}
    retention-days: ${NEWS_RETENTION_DAYS:7}
  economic:
    provider-mode: ${ECONOMIC_PROVIDER_MODE:external}
    api-base-url: ${ECONOMIC_PROVIDER_BASE_URL:https://nfs.faireconomy.media/}
    api-key: ${ECONOMIC_PROVIDER_API_KEY:}
    sync-rate-ms: ${ECONOMIC_SYNC_RATE_MS:7200000}
    retention-hours: ${ECONOMIC_RETENTION_HOURS:24}
  cleanup:
    news-retention-cron: ${NEWS_CLEANUP_CRON:0 0 * * * *}
    economic-retention-cron: ${ECONOMIC_CLEANUP_CRON:0 0 * * * *}
  python-engine:
    base-url: ${PYTHON_ENGINE_URL:http://localhost:8000}
    api-key: ${PYTHON_ENGINE_API_KEY:}

---
# Test profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/quantedge_test}
    username: ${SPRING_DATASOURCE_USERNAME:quantifiedge}
    password: ${SPRING_DATASOURCE_PASSWORD:quantifiedge_test}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

quantedge:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-256-bits-minimum
  encryption:
    key: test-encryption-key-for-unit-tests-only-256-bits-fixed
  cors:
    allowed-origins: http://localhost:3000